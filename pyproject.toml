[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dexport"
dynamic = ["version"]
description = "Drive your own Discord session from the CLI by attaching to the running desktop client over CDP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patruxs", email = "90237708+Patruxs@users.noreply.github.com" }]
keywords = ["discord", "cli", "cdp", "playwright", "export"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "playwright>=1.40",
    "typer>=0.12",
    "rich>=13.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "mypy>=1.14",
]

[project.scripts]
dexport = "dexport.cli:app"

[project.urls]
Homepage = "https://github.com/Patruxs/dexport"
Repository = "https://github.com/Patruxs/dexport"
Documentation = "https://github.com/Patruxs/dexport/blob/main/docs/ARCHITECTURE.md"
Issues = "https://github.com/Patruxs/dexport/issues"
Changelog = "https://github.com/Patruxs/dexport/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

# The package directory is `src/` but the import name is `dexport`, so the
# mapping below is what ties the two together. setuptools (unlike hatchling)
# supports this rewrite in editable installs, which is why it is the backend.
# `packages` must be listed explicitly: auto-discovery cannot see through the
# rename. Add a row when you add a sub-package under src/ - the guard is
# tests/test_docs.py::test_pyproject_lists_every_subpackage.
[tool.setuptools]
package-dir = { "dexport" = "src" }
packages = ["dexport", "dexport.cli", "dexport.launcher"]

[tool.setuptools.dynamic]
# Single source of truth for the version: src/__init__.py::__version__
version = { attr = "dexport.__version__" }

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",           # Protocol method bodies
    "pragma: no cover",
]

# ---------------------------------------------------------------------------
# Lint / format (ruff)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade (modern syntax for the declared python floor)
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific (incl. unused-noqa)
    "BLE",      # blind except — must be justified with a noqa comment
    "S",        # bandit — subprocess/urllib use is deliberate; see noqa notes
]
ignore = [
    "S603",     # subprocess without shell=True is what we want; args are our own
    "S607",     # partial executable paths (pgrep/flatpak/tasklist) are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]   # asserts and fake tokens in tests

[tool.ruff.lint.isort]
known-first-party = ["dexport"]

# ---------------------------------------------------------------------------
# Types (mypy)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["rapidfuzz.*"]
ignore_missing_imports = true
