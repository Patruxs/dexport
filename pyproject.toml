[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dexport"
version = "0.0.1"
description = "Drive your own Discord session from the CLI over CDP."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Patruxs" }]

dependencies = [
    "playwright>=1.40",
    "typer>=0.12",
    "rich>=13.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "mypy>=1.14",
]

[project.scripts]
dexport = "dexport.cli:app"

[tool.setuptools]
packages = ["dexport", "dexport.cli", "dexport.launcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
